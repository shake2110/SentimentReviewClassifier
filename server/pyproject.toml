[project]
name = "aspectlens-server"
version = "1.0.0"
description = "Aspect-based review sentiment API: splits reviews into product parts and scores each one."
requires-python = ">=3.11,<3.13"
dependencies = [
    "flask>=3.0",
    "flask-cors>=5.0",
    "pymongo>=4.8",
    "pyjwt>=2.9",
    "bcrypt>=4.2",
    "python-dotenv>=1.0",
    "pillow>=10.4",
    "torch>=2.4",
    "transformers>=4.44",
    "sentence-transformers>=3.0",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: loads the real ML models (first run downloads ~800MB)"]
